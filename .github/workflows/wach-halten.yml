name: Cloud wach halten

# Supabase legt kostenlose Projekte nach 7 Tagen ohne Nutzung schlafen.
# Ein kleiner Aufruf pro Tag verhindert das.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          URL=$(node -p "require('./src/cloud.config.json').url")
          KEY=$(node -p "require('./src/cloud.config.json').key")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Cloud noch nicht eingerichtet."
            exit 0
          fi
          curl --fail --silent --show-error "$URL/rest/v1/touren?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
